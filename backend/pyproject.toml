[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracework"
version = "0.1.0"
description = "Tracework backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "google-api-python-client>=2.180,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pymupdf>=1.28,<2",
    "PyJWT[crypto]>=2.10,<3",
    "python-docx>=1.2,<2",
    "pydantic-ai-slim[google]>=2.53,<3",
    "rapidfuzz>=3.14,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
