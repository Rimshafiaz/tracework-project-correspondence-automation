services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracework
      POSTGRES_USER: tracework
      POSTGRES_PASSWORD: tracework
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracework -d tracework"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - tracework_postgres:/var/lib/postgresql/data

volumes:
  tracework_postgres:
